name: Fix Lean CI coverage

on:
  push:
    branches: ["main"]
    paths:
      - '.github/workflows/fix-lean-ci-coverage.yml'

permissions:
  contents: write

concurrency:
  group: fix-lean-ci-coverage-main
  cancel-in-progress: true

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Make normal CI build every default Lean target
        shell: python
        run: |
          from pathlib import Path
          p = Path('.github/workflows/prover.yml')
          text = p.read_text()
          old = '        run: lake build Descent ValidationShared\n'
          new = '        run: lake build\n'
          assert text.count(old) == 1, f'expected exactly one build command, found {text.count(old)}'
          p.write_text(text.replace(old, new))
          Path('.github/workflows/fix-lean-ci-coverage.yml').unlink()
      - name: Commit directly to main
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/prover.yml .github/workflows/fix-lean-ci-coverage.yml
          git commit -m 'Build every default Lean target in CI'
          git push origin HEAD:main
