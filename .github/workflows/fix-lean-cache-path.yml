name: Fix Lean dependency cache path

on:
  push:
    branches: ["main"]
    paths:
      - '.github/workflows/fix-lean-cache-path.yml'

permissions:
  contents: write

concurrency:
  group: fix-lean-cache-path-main
  cancel-in-progress: true

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Correct cache path and remove this helper
        shell: python
        run: |
          from pathlib import Path
          p = Path('.github/workflows/prover.yml')
          text = p.read_text()
          old = "      - name: Cache Lake dependencies\n        id: lake-deps-cache\n        uses: actions/cache@v4\n        with:\n          path: ~/.elan\n"
          new = "      - name: Cache Lake dependencies\n        id: lake-deps-cache\n        uses: actions/cache@v4\n        with:\n          path: .lake/packages\n"
          assert text.count(old) == 1, f'expected one bad dependency cache block, found {text.count(old)}'
          p.write_text(text.replace(old, new))
          Path('.github/workflows/fix-lean-cache-path.yml').unlink()
      - name: Commit directly to main
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/prover.yml .github/workflows/fix-lean-cache-path.yml
          git commit -m 'Fix Lean dependency cache path'
          git pull --rebase origin main
          git push origin HEAD:main
