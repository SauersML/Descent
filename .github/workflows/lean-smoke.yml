name: Lean Regression Smoke

on:
  push:
    branches: ["main"]
    paths:
      - '.github/workflows/lean-smoke.yml'
  workflow_dispatch:

concurrency:
  group: lean-regression-smoke-main
  cancel-in-progress: true

permissions:
  contents: read
  issues: write

jobs:
  recent-modules:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Cache elan
        id: elan-cache
        uses: actions/cache@v4
        with:
          path: ~/.elan
          key: ${{ runner.os }}-elan-${{ hashFiles('lean-toolchain') }}
      - name: Install elan
        if: steps.elan-cache.outputs.cache-hit != 'true'
        run: curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y
      - name: Add elan to PATH
        run: echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Cache Lake dependencies
        id: deps
        uses: actions/cache@v4
        with:
          path: .lake/packages
          key: ${{ runner.os }}-lake-deps-v1-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}
          restore-keys: |
            ${{ runner.os }}-lake-deps-v1-
      - name: Fetch dependency cache
        if: steps.deps.outputs.cache-hit != 'true'
        run: lake exe cache get
      - name: Build recent Lean regression window
        id: build
        shell: bash
        run: |
          set +e
          lake build Descent.Coalescent.TwoLocusHistory Descent.Coalescent.StructuredPresentDay 2>&1 | tee /tmp/smoke.log
          status=${PIPESTATUS[0]}
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Report smoke result
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          STATUS: ${{ steps.build.outputs.status }}
        shell: bash
        run: |
          {
            echo "### Lean recent-module smoke"
            echo
            echo "Commit: \`$SHA\`"
            echo "Exit status: \`$STATUS\`"
            echo
            echo '```text'
            tail -n 350 /tmp/smoke.log
            echo '```'
          } > /tmp/report.md
          gh issue comment 1 --repo "$REPO" --body-file /tmp/report.md
          test "$STATUS" -eq 0
