name: Lean Lint Fast

on:
  push:
    branches: ["main"]
    paths:
      - '.github/workflows/lean-lint-fast.yml'
  workflow_dispatch:

concurrency:
  group: lean-lint-fast-main
  cancel-in-progress: true

permissions:
  contents: read
  issues: write

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Cache Lean toolchain
        id: elan-cache
        uses: actions/cache@v4
        with:
          path: ~/.elan
          key: ${{ runner.os }}-elan-${{ hashFiles('lean-toolchain') }}
      - name: Install elan
        if: steps.elan-cache.outputs.cache-hit != 'true'
        run: curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y
      - name: Add elan to PATH
        run: echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Fetch precompiled dependencies
        run: lake exe cache get
      - name: Restore successful full-build cache
        id: project-cache
        uses: actions/cache@v4
        with:
          path: .lake/build
          key: ${{ runner.os }}-descent-fast-v1-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'lakefile.lean', 'Descent.lean', 'Counterexamples.lean', 'Descent/**/*.lean', 'Counterexamples/**/*.lean', 'validation/**/*.lean') }}
          restore-keys: |
            ${{ runner.os }}-descent-fast-v1-
      - name: Build Descent only on cache miss
        if: steps.project-cache.outputs.cache-hit != 'true'
        run: lake build Descent
      - name: Run environment linters
        id: lint
        shell: bash
        run: |
          set +e
          lake env lean validation/code/Lint.lean 2>&1 | tee /tmp/lint.log
          status=${PIPESTATUS[0]}
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Report linter result
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          STATUS: ${{ steps.lint.outputs.status }}
        shell: bash
        run: |
          {
            echo "### Lean standalone linter"
            echo
            echo "Commit: \`$SHA\`"
            echo "Exit status: \`$STATUS\`"
            echo
            echo '```text'
            tail -n 350 /tmp/lint.log
            echo '```'
          } > /tmp/report.md
          gh issue comment 1 --repo "$REPO" --body-file /tmp/report.md
          test "$STATUS" -eq 0
