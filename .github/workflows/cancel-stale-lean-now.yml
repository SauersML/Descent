name: Cancel stale Lean diagnostics now

on:
  push:
    branches: ["main"]
    paths:
      - '.github/workflows/cancel-stale-lean-now.yml'

jobs:
  cancel:
    strategy:
      fail-fast: false
      matrix:
        group:
          - 'Descent CI-refs/heads/main'
          - 'lean-lint-fast-main'
          - 'lean-audit-smoke-main'
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ matrix.group }}
      cancel-in-progress: true
    timeout-minutes: 2
    steps:
      - run: echo "Cancelled stale group ${{ matrix.group }}"
