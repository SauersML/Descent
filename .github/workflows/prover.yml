name: Lean Prover CI

on:
  schedule:
    - cron: '*/140 * * * *'
  push:
    branches: [ "main" ]
    paths:
      - 'proofs/**'
      - 'map/correctability.rs'
      - 'lakefile.lean'
      - 'lean-toolchain'
      - '.github/workflows/prover.yml'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'proofs/**'
      - 'map/correctability.rs'
      - 'lakefile.lean'
      - 'lean-toolchain'
      - '.github/workflows/prover.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

permissions:
  contents: read
  pull-requests: write

jobs:
  gate:
    name: Gate scheduled runs on recent changes
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - id: check
        shell: bash
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "Event ${{ github.event_name }} is not a schedule; running."
            echo "run=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          latest=$(git log -1 --format=%ct)
          now=$(date +%s)
          age_min=$(( (now - latest) / 60 ))
          window=180
          if [ "$age_min" -lt "$window" ]; then
            echo "Last commit ${age_min}m ago (< ${window}m); running scheduled job."
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "Last commit ${age_min}m ago (>= ${window}m); nothing changed, skipping."
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi
  prove:
    needs: gate
    if: ${{ github.event_name != 'schedule' || needs.gate.outputs.run == 'true' }}
    runs-on: ubuntu-latest
    # The full cold-ish Lean root takes about eight minutes on a GitHub runner;
    # the transitive axiom scan must still get time to run afterward.  Twenty
    # minutes remains a hard hang detector while making the mandatory audit
    # reachable instead of timing out immediately after a successful build.
    timeout-minutes: 20
    
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        
      - name: Cache Lean toolchain
        id: elan-cache
        uses: actions/cache@v4
        with:
          path: ~/.elan
          key: ${{ runner.os }}-elan-${{ hashFiles('lean-toolchain') }}

      - name: Install elan
        if: steps.elan-cache.outputs.cache-hit != 'true'
        run: curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y

      - name: Add elan to PATH
        run: echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          
      - name: Cache Lake dependencies
        id: lake-deps-cache
        uses: actions/cache@v4
        with:
          path: .lake/packages
          key: ${{ runner.os }}-lake-deps-v1-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}
          restore-keys: |
            ${{ runner.os }}-lake-deps-v1-

      - name: Cache compiled project
        uses: actions/cache@v4
        with:
          path: .lake/build
          key: ${{ runner.os }}-gnomon-v1-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'lakefile.lean', 'proofs/**/*.lean') }}
          restore-keys: |
            ${{ runner.os }}-gnomon-v1-

      - name: Fetch precompiled dependencies
        if: steps.lake-deps-cache.outputs.cache-hit != 'true'
        run: lake exe cache get

      # Compile first so syntax/elaboration/axiom failures are never hidden by
      # an independent provenance or validation-ratchet failure below.  Every
      # gate remains mandatory; this ordering maximizes diagnostic signal from
      # a single remote run.
      # `ValidationShared` carries the generated-declaration filter and the
      # results writer that the detectors below import.  Naming only
      # `Calibrator` leaves those oleans unbuilt and every detector step fails
      # on an unknown module.
      - name: Build project
        run: lake build Calibrator ValidationShared

      # CODE VALIDATION, in two steps because there are exactly two instruments.
      #
      # The calibration runs FIRST and gates the laundering detector.  A detector
      # that reports nothing is indistinguishable from a clean corpus, so its
      # report is not evidence until both directions are asserted: every planted
      # pattern reported in the right family, and no finding at gating severity
      # on clean mathematics.  This step also fails if the calibration file is
      # deleted, which has happened once.
      - name: Calibrate the laundering detector
        run: python3 proofs/validation/code/test_check.py

      # Source text: style, structural guards, laundering, regimes, root import
      # closure, wiring.  Was six separate steps in three directories, each with
      # its own idea of where the corpus is; they disagreed.
      - name: Code validation (source text)
        run: python3 proofs/validation/code/check.py

      # Elaborated environment: transitive axiom closure, laundered premises,
      # theorem-valued structure fields, rfl proofs.  Was four separate `lake env
      # lean` invocations, two of which carried private copies of the
      # generated-declaration filter that disagreed with `Shared.DeclFilter`.
      #
      # Source text and elaborated type are different objects and each sees what
      # the other cannot; that is why this stays two steps and not one.
      - name: Code validation (elaborated environment)
        run: lake env lean proofs/validation/code/Check.lean

      - name: Verify arithmetic runtime semantics
        working-directory: proofs/validation/empirical/invariants
        run: python3 test_lean_semantics.py

      - name: Regenerate the extracted definition table
        # defs.json and lean_defs.py are generated, never committed: they are
        # derived from proofs/Calibrator/ and a committed snapshot drifts. CI
        # must build them from the revision under test, which is also what
        # makes the battery below evidence about THIS commit rather than about
        # whenever someone last refreshed a cache.
        run: python3 proofs/validation/empirical/extract/emit.py

      # The identity gate's calibration runs BEFORE the battery, for the same
      # reason the laundering calibration runs before check.py. The identity
      # gate's finding is that a simulation MATCH can be an algebraic
      # tautology -- the oracle estimating its truth with an estimator the
      # definition reduces to, so the residual is zero for every seed. A
      # detector for that is worthless in both directions until both are
      # asserted: the real bodies must be reported as identities, and a body
      # that is genuinely a different function of the same inputs (a squared
      # F_ST, a wrong constant factor) must NOT be. The bodies it tests are
      # STUBS written in the test file, so the calibration is about the gate's
      # logic and not about the corpus; it must run after emit.py only because
      # importing run.py pulls the extracted table in. Well under a second.
      - name: Calibrate the identity gate
        working-directory: proofs/validation/empirical/differential
        run: python3 test_identity_gate.py

      # Both directions, exactly like the laundering calibration above and for
      # the same reason: the round-trip checks exist to catch a definition
      # written the wrong way round, and a detector that reports nothing is
      # indistinguishable from a clean corpus. This asserts that the correct
      # definition is clean AND that four planted wrong-direction definitions
      # are each reported as a verdict regression. The corpus carried exactly
      # that defect -- amCorrectedPortability multiplied by the artifact
      # instead of its reciprocal -- until cd95052a.
      #
      # After the extraction step because it imports run.py, which loads the
      # definition table at import.
      - name: Calibrate the round-trip direction checks
        working-directory: proofs/validation/empirical/differential
        run: python3 test_roundtrip.py

      # Hand-verified ground truth for the parser and translator, and the only
      # thing that would have caught the extraction tier going silent: while
      # `extract/` resolved its corpus root one directory too high, `emit.py`
      # parsed zero definitions and exited 0, and the battery below compared an
      # empty table against its independent reference without objecting.
      #
      # It was excluded because it pinned absolute LINE NUMBERS ("neiFst line:
      # got 46, want 42") and so failed for reasons unrelated to what it tests.
      # It no longer does: line attribution is checked against the source, and
      # an empty table is reported as an extraction failure rather than raising
      # KeyError on the first lookup. Deterministic, dependency-free, ~2s.
      - name: Parser and translator ground truth
        working-directory: proofs/validation/empirical/extract
        run: python3 test_parser.py

      - name: Differential battery
        # 67 checks comparing each transcribed Lean body against an
        # independently written reference, plus a totality audit over ~160k
        # points. Exact arithmetic on a fixed grid, so the verdict is
        # reproducible. It also gates the EXPECTED disagreements: a check
        # pinned as model-differing that starts agreeing is a regression.
        #
        # Now also carries the identity gate and the coalescent scaling
        # checks. The identity checks pin three definitions whose banked
        # simulation MATCH was a tautology, so that nobody re-banks them; the
        # scaling checks are dimensional homogeneity in the only form that
        # survives this corpus's conventions, since term-by-term homogeneity
        # flags every discrete per-generation recurrence as a false positive.
        working-directory: proofs/validation/empirical/differential
        run: python3 run.py

      # The metamorphic calibration runs BEFORE the metamorphic gate, for the
      # third time in this file and for the same reason: a detector's silence
      # is not evidence until both directions are asserted. Six planted defects
      # -- an allele-relabelling asymmetry, a wrong scaling exponent, an
      # argument asymmetry, a broken coalescent rescaling, an order dependence
      # and a lost normalisation -- must each be caught, three clean bodies
      # must produce nothing, and each plant must be caught by the relation
      # that names it and NOT by the others, so the gate can localise rather
      # than merely alarm. Stub bodies only: no Lean, no generated table.
      - name: Calibrate the metamorphic gate
        run: python3 proofs/validation/empirical/metamorphic/test_metamorphic.py

      # Metamorphic relations: transformations of the INPUT whose effect on the
      # OUTPUT is known exactly. This qualifies as a required check on the same
      # grounds as the differential battery -- the inputs are literals in the
      # table, the transformation is exact and the expected relation is an
      # identity, so re-running cannot change the verdict. There is no sampling
      # and no oracle, which is the point: a violated metamorphic relation
      # admits no convention argument. If relabelling which allele is called
      # reference moved an F_ST, that would be a defect under every convention.
      #
      # It also gates COVERAGE. Every extractable scalar definition in a swept
      # module must declare its relations or declare, with a reason, that none
      # applies; a new definition landing in a swept module with neither fails
      # here. And like the differential battery it gates its EXPECTED
      # violations: a relation pinned as deliberately unsatisfied that starts
      # holding is a regression too.
      - name: Metamorphic relation gate
        run: python3 proofs/validation/empirical/metamorphic/run.py

      # The scoring kernel's arithmetic is part of the specification: per-column
      # f32 accumulation in variant order, flushed to an f64 master every 256
      # variants. That is what makes the score's error independent of the
      # variant count (measured flat at ~1e-7 cohort SD from 1e4 to 1e6
      # variants; removing only the flush makes it grow to 1.2e-5 and depend on
      # variant order). A single build flag dissolves it with no source diff and
      # no test failure on small inputs, so the flags are guarded directly. The
      # emitted aarch64 assembly and LLVM IR were read by hand at 0449db90 and
      # are clean -- no fast-math, no reassociation, no cross-lane reduction --
      # and that reading is the baseline this step protects.
      - name: Build-configuration guard (FP semantics)
        run: python3 proofs/validation/empirical/metamorphic/build_flags.py

      # WHAT IS NOT WIRED UP, and why. The steps above are all of
      # proofs/validation/code/ plus the subset of proofs/validation/empirical/
      # that is deterministic, dependency-free and about twenty seconds in
      # total. Everything else under empirical/ falls into one of four buckets,
      # none of which belongs in a required check:
      #
      #   * Monte-Carlo suites (coalescent_diff, drift_diff, block_count,
      #     ldsc_diff, meff_*, pencil, tau_c, ld_coverage_boundary, ...).
      #     Their verdicts are statistical, so at any sample size they carry a
      #     false failure rate. A required check that fails at random gets
      #     ignored, which costs more than the coverage would gain.
      #   * Deterministic but slow: empirical/imitation_rigidity/check_imitation.py
      #     is 44s and empirical/invariants/vacuity.py is 60s, against ~20s for
      #     all of the above together.
      #   * Needs numpy, scipy, sympy or z3 (condensation, bundle_rigidity,
      #     invariants/check_ranges.py, extract/xcheck_vector.py, all under
      #     empirical/). Installable,
      #     but check_ranges prints its findings and exits 0 whatever it finds,
      #     so as a gate it would catch nothing but its own crashes.
      #     empirical/smt/ is in this bucket by dependency only, and is
      #     deliberately built to the opposite standard: run_statements.py
      #     exits nonzero when a pinned verdict changes, and a z3 `unknown` is
      #     reported as UNKNOWN and fails, never folded into "no counterexample
      #     found". Its sweep.py scans the whole corpus for VACUOUS and
      #     TAUTOLOGICAL statements (0 and 0 as of 2026-08-04, over 1861 and
      #     1065 checkable theorems) and is a minute rather than the ~20s the
      #     gated empirical steps get in total. Promoting run_statements.py is
      #     a matter of accepting the z3 dependency, not of fixing flakiness:
      #     its verdicts are deterministic and its calibration is in the same
      #     file as the statements it checks.
      #     symbolic/cas_differential.py is in this bucket too and stays out
      #     for a second reason: `sympy.simplify` has no bounded running time,
      #     and a simplify that does not close is a false NEGATIVE that reads
      #     as agreement. It carries a per-expression alarm so a slow
      #     expression reports TIMEOUT rather than hanging, and it records two
      #     of its own known false negatives in its header. Its two findings
      #     that reduce to exact arithmetic on a fixed grid were PROMOTED into
      #     the differential battery above (sections 20 and 21) with a
      #     two-directional calibration, which is the shape a sympy finding
      #     has to take before it can gate anything.
      # (extract/test_parser.py used to be listed here for pinning absolute
      # LINE NUMBERS. It no longer does, and it is now a required step above.
      # Leaving it excluded was expensive: while it sat red, nobody read it, and
      # it was the only instrument positioned to notice that the extraction tier
      # had gone silent. A red ground-truth gate must be repointed, not left.)

      # BOTH DIRECTIONS FIRST, as with the laundering and identity-gate
      # calibrations. Nobody had checked that the Lean corpus and the shipped
      # implementation agree, and a theorem about a model the code does not
      # implement is worse than no theorem: it is a false assurance that no
      # other guard in proofs/validation/ can see. So the detector is asserted
      # in both directions before its verdict is read -- a clean tree is silent,
      # and seven planted one-place defects (one per finding class, plus an
      # unreadable corpus) are each reported.
      #
      # The empty-corpus case is not decoration. The extraction tier resolved
      # its corpus root one directory too high, parsed zero definitions and
      # exited 0; this check would consume the same table, so it asserts that an
      # empty table is an error rather than a pass.
      - name: Calibrate the corpus/implementation correspondence guard
        run: python3 proofs/validation/empirical/lean_code_map/test_map_check.py

      # The correspondence table itself: which Calibrator declaration describes
      # which shipped function, and whether that has been verified. Anchored to
      # declaration NAMES plus content hashes, never to line numbers -- the
      # mistake extract/test_parser.py was excluded for. A mapped Lean body or
      # Rust body that changed is STALE, not wrong: the repair is to re-read
      # both sides and re-bless, not to assume the mathematics broke.
      #
      # It also carries the unguarded-code inventory: the clamps, epsilons,
      # fallback branches, divisions and square roots inside the mapped Rust,
      # recorded so a newly introduced numerical guard with no corresponding
      # invariant in the corpus shows up as a finding. Every budget is 0.
      #
      # After emit.py, which it consumes through extract/api.py.
      - name: Corpus/implementation correspondence
        run: python3 proofs/validation/empirical/lean_code_map/map_check.py

      # A reference evaluation states a VALUE so that a body with the wrong
      # constant in front fails it. A stated value of ZERO fails nothing:
      # `c * 0 = 0` is that same value for every `c`, whatever the arguments
      # are. So a theorem named `_at_reference_point` whose value is zero reads
      # as scale-pinning evidence while providing none.
      #
      # The corpus had 45 of them. They were not scattered mistakes: the naming
      # convention had been applied to every evaluation a definition admitted,
      # including the ones that can only ever be zero, so every discrepancy
      # measure, regret, energy and empty sum acquired one. 17 of 17 audited in
      # one pass were identities rather than mislocated reference points.
      #
      # Budget 0, so the corpus cannot re-acquire one. The failure message names
      # BOTH repairs, because the wrong one is destructive: moving a metric off
      # its own diagonal does not fix `d P P = 0`, it deletes it.
      - name: Vacuous reference evaluations
        run: python3 proofs/validation/empirical/lean_code_map/degenerate.py --gate

      # Now also the numeric differential: every mapped Calibrator definition
      # evaluated against the REAL map/correctability.rs on the committed
      # boundary/degenerate fixture grid, ~12800 comparisons in under a tenth of
      # a second. Deterministic, exact arithmetic on a fixed grid, so the
      # verdict is reproducible -- the same reason the differential battery
      # above qualifies as a gate.
      #
      # This step could not compile for as long as it had been required: it
      # reached the implementation through `#[path = "../../../map/..."]`, one
      # level short of the repository root, so `cargo test` failed to build and
      # executed nothing. A gate that cannot build is not a weaker gate; it is
      # no gate at all, wearing the failure mode of infrastructure noise.
      - name: Executable correctability contract
        run: cargo test --manifest-path proofs/validation/empirical/correctability_calculator/Cargo.toml

  auto-close-failed-proof-pr:
    runs-on: ubuntu-latest
    needs: prove
    # IMPORTANT: always() ensures this job runs even if prove fails
    if: always() && github.event_name == 'pull_request'
    steps:
      - name: Close PR if proofs/ or Lean rules violated
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const pr = context.payload.pull_request;
            if (!pr) {
              core.info('No pull request context; skipping.');
              return;
            }

            const files = await github.paginate(
              github.rest.pulls.listFiles,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: pr.number,
                per_page: 100,
              }
            );

            const touchesProofs = files.some((file) => file.filename.startsWith('proofs/'));
            const touchesLean = files.some((file) =>
              file.filename.startsWith('proofs/') ||
              file.filename === 'lakefile.lean' ||
              file.filename === 'lean-toolchain' ||
              file.filename === '.github/workflows/prover.yml'
            );
            const addsNewFiles = files.some((file) => file.status === 'added');

            const commits = await github.paginate(
              github.rest.pulls.listCommits,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: pr.number,
                per_page: 100,
              }
            );
            const hasJulesCommit = commits.some((c) => {
              const name = (c.commit && c.commit.author && c.commit.author.name) || '';
              return name.toLowerCase().includes('jules');
            });
            
            // Also detect Jules PRs by branch name pattern
            const branchName = pr.head.ref;
            const julesApiBranchPattern = /^fix-(calibrator|proofs|build).*-\d+$/;
            const julesScriptBranchPattern = /^jules-improvement-\d{8}-\d{6}$/;
            const hasJulesBranch = julesApiBranchPattern.test(branchName) || julesScriptBranchPattern.test(branchName);
            const isJulesPR = hasJulesCommit || hasJulesBranch;

            const proverFailed = '${{ needs.prove.result }}' === 'failure';

            // Close if: (touches proofs AND failed) OR (is Jules PR AND failed) OR (adds new files to Lean paths)
            const shouldClose =
              (touchesProofs && proverFailed) ||
              (isJulesPR && proverFailed) ||
              (touchesLean && addsNewFiles);

            if (!shouldClose) {
              core.info('No auto-close conditions met; skipping.');
              return;
            }

            const body = [
              '## ❌ Lean Prover CI Failed',
              '',
              'This PR was auto-closed due to one or more rules:',
              `- Touches \`proofs/\` and Lean Prover CI failed: ${touchesProofs && proverFailed ? 'yes' : 'no'}`,
              `- Jules PR (detected by branch pattern or commit author) and build failed: ${isJulesPR && proverFailed ? 'yes' : 'no'}`,
              `- Touches Lean-related files and adds new files: ${touchesLean && addsNewFiles ? 'yes' : 'no'}`,
              '',
              `Branch: \`${branchName}\``,
              `Jules PR detected: ${isJulesPR ? 'yes' : 'no'} (branch pattern: ${hasJulesBranch}, commit author: ${hasJulesCommit})`,
              '',
              'Please fix the issue(s) and reopen when ready.',
            ].join('\n');

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr.number,
              body,
            });

            await github.rest.pulls.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr.number,
              state: 'closed',
            });

            core.setFailed('Lean Prover CI failed for PR that modifies proofs/.');
