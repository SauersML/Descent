name: Lean Prover CI

on:
  schedule:
    - cron: '*/140 * * * *'
  push:
    branches: [ "main" ]
    paths:
      - 'proofs/**'
      - 'map/correctability.rs'
      - 'lakefile.lean'
      - 'lean-toolchain'
      - '.github/workflows/prover.yml'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'proofs/**'
      - 'map/correctability.rs'
      - 'lakefile.lean'
      - 'lean-toolchain'
      - '.github/workflows/prover.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

permissions:
  contents: read
  pull-requests: write

jobs:
  gate:
    name: Gate scheduled runs on recent changes
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - id: check
        shell: bash
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "Event ${{ github.event_name }} is not a schedule; running."
            echo "run=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          latest=$(git log -1 --format=%ct)
          now=$(date +%s)
          age_min=$(( (now - latest) / 60 ))
          window=180
          if [ "$age_min" -lt "$window" ]; then
            echo "Last commit ${age_min}m ago (< ${window}m); running scheduled job."
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "Last commit ${age_min}m ago (>= ${window}m); nothing changed, skipping."
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi
  prove:
    needs: gate
    if: ${{ github.event_name != 'schedule' || needs.gate.outputs.run == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        
      - name: Cache Lean toolchain
        id: elan-cache
        uses: actions/cache@v4
        with:
          path: ~/.elan
          key: ${{ runner.os }}-elan-${{ hashFiles('lean-toolchain') }}

      - name: Install elan
        if: steps.elan-cache.outputs.cache-hit != 'true'
        run: curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y

      - name: Add elan to PATH
        run: echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          
      - name: Cache Lake dependencies
        id: lake-deps-cache
        uses: actions/cache@v4
        with:
          path: .lake/packages
          key: ${{ runner.os }}-lake-deps-v1-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}
          restore-keys: |
            ${{ runner.os }}-lake-deps-v1-

      - name: Cache compiled project
        uses: actions/cache@v4
        with:
          path: .lake/build
          key: ${{ runner.os }}-gnomon-v1-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'lakefile.lean', 'proofs/**/*.lean') }}
          restore-keys: |
            ${{ runner.os }}-gnomon-v1-

      - name: Fetch precompiled dependencies
        if: steps.lake-deps-cache.outputs.cache-hit != 'true'
        run: lake exe cache get

      - name: Structural guards
        run: python3 scripts/check-identifications.py

      - name: Executable correctability contract
        run: cargo test --manifest-path proofs/validation/correctability_calculator/Cargo.toml

      - name: Build project
        run: lake build Calibrator --jobs $(nproc)

  auto-close-failed-proof-pr:
    runs-on: ubuntu-latest
    needs: prove
    # IMPORTANT: always() ensures this job runs even if prove fails
    if: always() && github.event_name == 'pull_request'
    steps:
      - name: Close PR if proofs/ or Lean rules violated
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const pr = context.payload.pull_request;
            if (!pr) {
              core.info('No pull request context; skipping.');
              return;
            }

            const files = await github.paginate(
              github.rest.pulls.listFiles,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: pr.number,
                per_page: 100,
              }
            );

            const touchesProofs = files.some((file) => file.filename.startsWith('proofs/'));
            const touchesLean = files.some((file) =>
              file.filename.startsWith('proofs/') ||
              file.filename === 'lakefile.lean' ||
              file.filename === 'lean-toolchain' ||
              file.filename === '.github/workflows/prover.yml'
            );
            const addsNewFiles = files.some((file) => file.status === 'added');

            const commits = await github.paginate(
              github.rest.pulls.listCommits,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: pr.number,
                per_page: 100,
              }
            );
            const hasJulesCommit = commits.some((c) => {
              const name = (c.commit && c.commit.author && c.commit.author.name) || '';
              return name.toLowerCase().includes('jules');
            });
            
            // Also detect Jules PRs by branch name pattern
            const branchName = pr.head.ref;
            const julesApiBranchPattern = /^fix-(calibrator|proofs|build).*-\d+$/;
            const julesScriptBranchPattern = /^jules-improvement-\d{8}-\d{6}$/;
            const hasJulesBranch = julesApiBranchPattern.test(branchName) || julesScriptBranchPattern.test(branchName);
            const isJulesPR = hasJulesCommit || hasJulesBranch;

            const proverFailed = '${{ needs.prove.result }}' === 'failure';

            // Close if: (touches proofs AND failed) OR (is Jules PR AND failed) OR (adds new files to Lean paths)
            const shouldClose =
              (touchesProofs && proverFailed) ||
              (isJulesPR && proverFailed) ||
              (touchesLean && addsNewFiles);

            if (!shouldClose) {
              core.info('No auto-close conditions met; skipping.');
              return;
            }

            const body = [
              '## ❌ Lean Prover CI Failed',
              '',
              'This PR was auto-closed due to one or more rules:',
              `- Touches \`proofs/\` and Lean Prover CI failed: ${touchesProofs && proverFailed ? 'yes' : 'no'}`,
              `- Jules PR (detected by branch pattern or commit author) and build failed: ${isJulesPR && proverFailed ? 'yes' : 'no'}`,
              `- Touches Lean-related files and adds new files: ${touchesLean && addsNewFiles ? 'yes' : 'no'}`,
              '',
              `Branch: \`${branchName}\``,
              `Jules PR detected: ${isJulesPR ? 'yes' : 'no'} (branch pattern: ${hasJulesBranch}, commit author: ${hasJulesCommit})`,
              '',
              'Please fix the issue(s) and reopen when ready.',
            ].join('\n');

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr.number,
              body,
            });

            await github.rest.pulls.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr.number,
              state: 'closed',
            });

            core.setFailed('Lean Prover CI failed for PR that modifies proofs/.');
