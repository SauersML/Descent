name: Lean Head Matrix

on:
  push:
    branches: ["main"]
    paths:
      - '.github/workflows/lean-heads.yml'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: lean-head-matrix-main
  cancel-in-progress: true

jobs:
  head:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix:
        target:
          - Descent.Blindness
          - Descent.Coalescent
          - Descent.Conditionals
          - Descent.Core
          - Descent.Decision
          - Descent.Foundations
          - Descent.Meta
          - Descent.Pangenome
          - Descent.PopGen
          - Descent.Portability
          - Descent.Program
          - Descent.Spectral
    steps:
      - uses: actions/checkout@v4
      - name: Cache Lean toolchain
        id: elan-cache
        uses: actions/cache@v4
        with:
          path: ~/.elan
          key: ${{ runner.os }}-elan-${{ hashFiles('lean-toolchain') }}
      - name: Install elan
        if: steps.elan-cache.outputs.cache-hit != 'true'
        run: curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y
      - name: Add elan to PATH
        run: echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Cache Lake dependencies
        id: deps
        uses: actions/cache@v4
        with:
          path: .lake/packages
          key: ${{ runner.os }}-lake-deps-v1-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}
          restore-keys: |
            ${{ runner.os }}-lake-deps-v1-
      - name: Fetch precompiled dependencies
        if: steps.deps.outputs.cache-hit != 'true'
        run: lake exe cache get
      - name: Build ${{ matrix.target }}
        id: compile
        shell: bash
        run: |
          set +e
          lake build '${{ matrix.target }}' 2>&1 | tee /tmp/head.log
          status=${PIPESTATUS[0]}
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Report failure
        if: steps.compile.outputs.status != '0'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          TARGET: ${{ matrix.target }}
        shell: bash
        run: |
          {
            echo "### Lean head failure: $TARGET"
            echo
            echo "Commit: \`$SHA\`"
            echo
            echo '```text'
            tail -n 350 /tmp/head.log
            echo '```'
          } > /tmp/report.md
          gh issue comment 1 --repo "$REPO" --body-file /tmp/report.md
          exit 1
