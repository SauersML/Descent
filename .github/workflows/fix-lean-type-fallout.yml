name: Fix Lean scaled-type fallout

on:
  push:
    branches: ["main"]
    paths:
      - '.github/workflows/fix-lean-type-fallout.yml'

permissions:
  contents: write

concurrency:
  group: Descent CI-refs/heads/main
  cancel-in-progress: true

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Fix missing scaling import and Rho callers
        shell: python
        run: |
          from pathlib import Path

          def rep(path, old, new):
              p = Path(path)
              s = p.read_text()
              c = s.count(old)
              assert c == 1, f'{path}: expected one match, got {c}: {old!r}'
              p.write_text(s.replace(old, new, 1))

          rep('Descent/Coalescent/SampleMonomorphism.lean',
              'import Descent.Coalescent.Duality\n',
              'import Descent.Coalescent.Duality\nimport Descent.Core.Scaling\n')

          p = 'Descent/Coalescent/StructuredPresentDay.lean'
          rep(p,
              'structure NonsingularAffineLDPoint {n : ℕ} (sys : AffineTwoDemeLDSystem n) where\n  rho : ℝ\n  migration : ℝ\n  rho_nonnegative : 0 ≤ rho\n  migration_nonnegative : 0 ≤ migration\n  operator_nonsingular :\n    (sys.drift + rho • sys.recombination + migration • sys.migration).det ≠ 0\n  within_numerator_nonzero :\n    (replaceColumn\n      (sys.drift + rho • sys.recombination + migration • sys.migration)',
              'structure NonsingularAffineLDPoint {n : ℕ} (sys : AffineTwoDemeLDSystem n) where\n  rho : Descent.Core.Rho\n  migration : ℝ\n  rho_nonnegative : 0 ≤ rho.value\n  migration_nonnegative : 0 ≤ migration\n  operator_nonsingular :\n    (sys.drift + rho.value • sys.recombination + migration • sys.migration).det ≠ 0\n  within_numerator_nonzero :\n    (replaceColumn\n      (sys.drift + rho.value • sys.recombination + migration • sys.migration)')

          rep(p,
              'theorem AffineTwoDemeLDSystem.crossD_eq_det_ratio {n : ℕ}\n    (sys : AffineTwoDemeLDSystem n) (rho M : ℝ) :\n    sys.toSystem.crossD rho M =\n      (replaceColumn\n        (sys.drift + rho • sys.recombination + M • sys.migration)\n        (fun i ↦ -(sys.forcingBase i + M * sys.forcingMigration i))\n        sys.crossSourceTarget).det /\n      (sys.drift + rho • sys.recombination + M • sys.migration).det := rfl',
              'theorem AffineTwoDemeLDSystem.crossD_eq_det_ratio {n : ℕ}\n    (sys : AffineTwoDemeLDSystem n) (rho : Descent.Core.Rho) (M : ℝ) :\n    sys.toSystem.crossD rho M =\n      (replaceColumn\n        (sys.drift + rho.value • sys.recombination + M • sys.migration)\n        (fun i ↦ -(sys.forcingBase i + M * sys.forcingMigration i))\n        sys.crossSourceTarget).det /\n      (sys.drift + rho.value • sys.recombination + M • sys.migration).det := rfl')

          rep(p,
              'theorem TwoDemeLDSystem.crossDCorrelation_eq_cramer_numerator_ratio {n : ℕ}\n    (sys : TwoDemeLDSystem n) (rho M : ℝ)\n    (hdet : (sys.operator rho M).det ≠ 0)\n    (hwithin : (replaceColumn (sys.operator rho M) (fun i ↦ -sys.forcing M i)\n      sys.withinSource).det ≠ 0) :\n    sys.crossDCorrelation rho M =\n      (replaceColumn (sys.operator rho M) (fun i ↦ -sys.forcing M i)\n        sys.crossSourceTarget).det /\n      (replaceColumn (sys.operator rho M) (fun i ↦ -sys.forcing M i)\n        sys.withinSource).det := by',
              'theorem TwoDemeLDSystem.crossDCorrelation_eq_cramer_numerator_ratio {n : ℕ}\n    (sys : TwoDemeLDSystem n) (rho : Descent.Core.Rho) (M : ℝ)\n    (hdet : (sys.operator rho.value M).det ≠ 0)\n    (hwithin : (replaceColumn (sys.operator rho.value M) (fun i ↦ -sys.forcing M i)\n      sys.withinSource).det ≠ 0) :\n    sys.crossDCorrelation rho M =\n      (replaceColumn (sys.operator rho.value M) (fun i ↦ -sys.forcing M i)\n        sys.crossSourceTarget).det /\n      (replaceColumn (sys.operator rho.value M) (fun i ↦ -sys.forcing M i)\n        sys.withinSource).det := by')

          rep(p,
              'theorem TwoDemeLDSystem.crossDCorrelation_panmixia {n : ℕ}\n    (sys : TwoDemeLDSystem n) (rho M : ℝ)\n    (hwithin : sys.withinD rho M ≠ 0)\n    (hpan : sys.crossD rho M = sys.withinD rho M) :',
              'theorem TwoDemeLDSystem.crossDCorrelation_panmixia {n : ℕ}\n    (sys : TwoDemeLDSystem n) (rho : Descent.Core.Rho) (M : ℝ)\n    (hwithin : sys.withinD rho M ≠ 0)\n    (hpan : sys.crossD rho M = sys.withinD rho M) :')

          Path('.github/workflows/fix-lean-type-fallout.yml').unlink()
      - name: Commit directly to main
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Descent/Coalescent/SampleMonomorphism.lean \
            Descent/Coalescent/StructuredPresentDay.lean \
            .github/workflows/fix-lean-type-fallout.yml
          git commit -m 'Fix scaled-type Lean call sites'
          git pull --rebase origin main
          git push origin HEAD:main
