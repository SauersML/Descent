name: Fix sample Tau theorem calls

on:
  push:
    branches: ["main"]
    paths:
      - '.github/workflows/fix-sample-tau-calls.yml'

permissions:
  contents: write

concurrency:
  group: Descent CI-refs/heads/main
  cancel-in-progress: true

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Wrap scaled-time theorem inputs
        shell: python
        run: |
          from pathlib import Path
          p = Path('Descent/Coalescent/SampleMonomorphism.lean')
          s = p.read_text()
          old = '    tagSampleMonomorphicProb p 2 tau = 1 - 2 * p * (1 - p) * Real.exp (-tau) := by'
          new = '    tagSampleMonomorphicProb p 2 (Descent.Core.Tau.ofScaled tau) =\n      1 - 2 * p * (1 - p) * Real.exp (-tau) := by'
          assert s.count(old) == 1
          s = s.replace(old, new, 1)
          old = '    tagSampleMonomorphicProb p 2 0 = p ^ 2 + (1 - p) ^ 2 := by'
          new = '    tagSampleMonomorphicProb p 2 (Descent.Core.Tau.ofScaled 0) =\n      p ^ 2 + (1 - p) ^ 2 := by'
          assert s.count(old) == 1
          s = s.replace(old, new, 1)
          p.write_text(s)
          Path('.github/workflows/fix-sample-tau-calls.yml').unlink()
      - name: Commit directly to main
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Descent/Coalescent/SampleMonomorphism.lean .github/workflows/fix-sample-tau-calls.yml
          git commit -m 'Fix typed Tau theorem calls'
          git pull --rebase origin main
          git push origin HEAD:main
