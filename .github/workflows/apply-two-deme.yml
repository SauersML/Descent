name: Apply two-deme Lean repair

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]
    paths:
      - '.github/workflows/apply-two-deme.yml'
      - '.github/scripts/type_two_deme.py'

permissions:
  contents: write
  issues: write

concurrency:
  group: apply-two-deme-main
  cancel-in-progress: true

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply source patch
        id: patch
        shell: bash
        run: |
          set +e
          python .github/scripts/type_two_deme.py 2>&1 | tee /tmp/type-two-deme.log
          status=${PIPESTATUS[0]}
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Report patch failure
        if: steps.patch.outputs.status != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo '### Two-deme type patch failed'
            echo
            echo '```text'
            cat /tmp/type-two-deme.log
            echo '```'
          } > /tmp/type-two-report.md
          gh issue comment 1 --repo "$GITHUB_REPOSITORY" --body-file /tmp/type-two-report.md
          exit 1
      - name: Commit directly to main
        if: steps.patch.outputs.status == '0'
        shell: bash
        run: |
          rm .github/scripts/type_two_deme.py .github/workflows/apply-two-deme.yml .github/workflows/type-two-deme-ld.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Descent/Coalescent/TwoDemeLDClosedForm.lean .github/scripts/type_two_deme.py \
            .github/workflows/apply-two-deme.yml .github/workflows/type-two-deme-ld.yml
          git commit -m 'Type scaled rates in two-deme LD closed form'
          git pull --rebase origin main
          git push origin HEAD:main
