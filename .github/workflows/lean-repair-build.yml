name: Lean Repair Build

on:
  push:
    branches: ["main"]
    paths:
      - 'Descent/**'
      - 'Descent.lean'
      - 'Counterexamples/**'
      - 'Counterexamples.lean'
      - 'validation/**'
      - '.github/workflows/lean-repair-build.yml'
  pull_request:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: lean-repair-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  issues: write

jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Cache Lean toolchain
        id: elan-cache
        uses: actions/cache@v4
        with:
          path: ~/.elan
          key: ${{ runner.os }}-elan-${{ hashFiles('lean-toolchain') }}
      - name: Install elan
        if: steps.elan-cache.outputs.cache-hit != 'true'
        run: curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y
      - name: Add elan to PATH
        run: echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Fetch precompiled dependencies
        run: lake exe cache get
      - name: Restore prior project build
        uses: actions/cache@v4
        with:
          path: .lake/build
          key: ${{ runner.os }}-descent-fast-v1-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'lakefile.lean', 'Descent.lean', 'Counterexamples.lean', 'Descent/**/*.lean', 'Counterexamples/**/*.lean', 'validation/**/*.lean') }}
          restore-keys: |
            ${{ runner.os }}-descent-fast-v1-
      - name: Compile every default Lean target
        id: compile
        shell: bash
        run: |
          set +e
          lake build 2>&1 | tee /tmp/repair-build.log
          status=${PIPESTATUS[0]}
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Report compile result
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          STATUS: ${{ steps.compile.outputs.status }}
        shell: bash
        run: |
          {
            echo "### Lean full repair build"
            echo
            echo "Commit: \`$SHA\`"
            echo "Exit status: \`$STATUS\`"
            echo
            echo '```text'
            tail -n 500 /tmp/repair-build.log
            echo '```'
          } > /tmp/report.md
          gh issue comment 1 --repo "$REPO" --body-file /tmp/report.md
          test "$STATUS" -eq 0
