name: Lean Fast Compile

on:
  push:
    branches: ["main"]
    paths:
      - '**/*.lean'
      - 'lakefile.lean'
      - 'lake-manifest.json'
      - 'lean-toolchain'
      - '.github/workflows/lean-fast.yml'
  pull_request:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: lean-fast-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  issues: write

jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - name: Cache Lean toolchain
        id: elan-cache
        uses: actions/cache@v4
        with:
          path: ~/.elan
          key: ${{ runner.os }}-elan-${{ hashFiles('lean-toolchain') }}

      - name: Install elan
        if: steps.elan-cache.outputs.cache-hit != 'true'
        run: curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y

      - name: Add elan to PATH
        run: echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Cache Lake dependencies
        id: lake-deps-cache
        uses: actions/cache@v4
        with:
          path: .lake/packages
          key: ${{ runner.os }}-lake-deps-v1-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}
          restore-keys: |
            ${{ runner.os }}-lake-deps-v1-

      - name: Fetch precompiled dependencies
        if: steps.lake-deps-cache.outputs.cache-hit != 'true'
        run: lake exe cache get

      - name: Cache compiled project
        uses: actions/cache@v4
        with:
          path: .lake/build
          key: ${{ runner.os }}-descent-fast-v1-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'lakefile.lean', 'Descent.lean', 'Counterexamples.lean', 'Descent/**/*.lean', 'Counterexamples/**/*.lean', 'validation/**/*.lean') }}
          restore-keys: |
            ${{ runner.os }}-descent-fast-v1-

      - name: Compile every default Lean target
        id: compile
        shell: bash
        run: |
          set +e
          lake build 2>&1 | tee /tmp/lean-build.log
          status=${PIPESTATUS[0]}
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Report compiler result
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          STATUS: ${{ steps.compile.outputs.status }}
        shell: bash
        run: |
          {
            echo "### Lean fast compile"
            echo
            echo "Commit: \`$SHA\`"
            echo "Exit status: \`$STATUS\`"
            echo
            echo '```text'
            tail -n 350 /tmp/lean-build.log
            echo '```'
          } > /tmp/report.md
          gh issue comment 1 --repo "$REPO" --body-file /tmp/report.md
          test "$STATUS" -eq 0
