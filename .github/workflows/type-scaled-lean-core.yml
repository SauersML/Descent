name: Type scaled Lean core APIs

on:
  push:
    branches: ["main"]
    paths:
      - '.github/workflows/type-scaled-lean-core.yml'

permissions:
  contents: write

concurrency:
  group: Descent CI-refs/heads/main
  cancel-in-progress: true

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Type Tau and generic Rho entrypoints
        shell: python
        run: |
          from pathlib import Path

          def rep(path, old, new):
              p = Path(path); s = p.read_text(); c = s.count(old)
              assert c == 1, f'{path}: expected 1 match, got {c} for {old!r}'
              p.write_text(s.replace(old, new, 1))

          p = 'Descent/Coalescent/SampleMonomorphism.lean'
          rep(p,
              'noncomputable def blockCountLaw (n k : ℕ) (tau : ℝ) : ℝ :=\n  ∑ j ∈ Finset.Icc k n,\n    Real.exp (-(deathRate j * tau))',
              'noncomputable def blockCountLaw (n k : ℕ) (tau : Descent.Core.Tau) : ℝ :=\n  ∑ j ∈ Finset.Icc k n,\n    Real.exp (-(deathRate j * tau.value))')
          rep(p,
              'noncomputable def tagSampleMonomorphicProb (p : ℝ) (n : ℕ) (tau : ℝ) : ℝ :=\n  ∑ k ∈ Finset.Icc 1 n, blockCountLaw n k tau * sampleMonomorphismEvent p k',
              'noncomputable def tagSampleMonomorphicProb (p : ℝ) (n : ℕ)\n    (tau : Descent.Core.Tau) : ℝ :=\n  ∑ k ∈ Finset.Icc 1 n, blockCountLaw n k tau * sampleMonomorphismEvent p k')

          s = Path(p).read_text()
          replacements = {
              'tagSampleMonomorphicProb (1 - p) n tau = tagSampleMonomorphicProb p n tau':
                  'tagSampleMonomorphicProb (1 - p) n (Descent.Core.Tau.ofScaled tau) =\n      tagSampleMonomorphicProb p n (Descent.Core.Tau.ofScaled tau)',
              'blockCountLaw 1 1 tau = 1':
                  'blockCountLaw 1 1 (Descent.Core.Tau.ofScaled tau) = 1',
              'tagSampleMonomorphicProb p 1 tau = 1':
                  'tagSampleMonomorphicProb p 1 (Descent.Core.Tau.ofScaled tau) = 1',
              'blockCountLaw 2 2 tau = Real.exp (-tau)':
                  'blockCountLaw 2 2 (Descent.Core.Tau.ofScaled tau) = Real.exp (-tau)',
              'blockCountLaw 2 1 tau = 1 - Real.exp (-tau)':
                  'blockCountLaw 2 1 (Descent.Core.Tau.ofScaled tau) = 1 - Real.exp (-tau)',
          }
          for old, new in replacements.items():
              assert s.count(old) == 1, f'{p}: expected one theorem call: {old}'
              s = s.replace(old, new, 1)
          Path(p).write_text(s)

          p = 'Descent/Coalescent/StructuredPresentDay.lean'
          rep(p,
              'noncomputable def TwoDemeLDSystem.stationaryCoordinate {n : ℕ}\n    (sys : TwoDemeLDSystem n) (rho M : ℝ) (k : Fin n) : ℝ :=\n  cramerCoordinate (sys.operator rho M)',
              'noncomputable def TwoDemeLDSystem.stationaryCoordinate {n : ℕ}\n    (sys : TwoDemeLDSystem n) (rho : Descent.Core.Rho) (M : ℝ) (k : Fin n) : ℝ :=\n  cramerCoordinate (sys.operator rho.value M)')
          rep(p,
              'noncomputable def TwoDemeLDSystem.crossD {n : ℕ}\n    (sys : TwoDemeLDSystem n) (rho M : ℝ) : ℝ :=',
              'noncomputable def TwoDemeLDSystem.crossD {n : ℕ}\n    (sys : TwoDemeLDSystem n) (rho : Descent.Core.Rho) (M : ℝ) : ℝ :=')
          rep(p,
              'noncomputable def TwoDemeLDSystem.withinD {n : ℕ}\n    (sys : TwoDemeLDSystem n) (rho M : ℝ) : ℝ :=',
              'noncomputable def TwoDemeLDSystem.withinD {n : ℕ}\n    (sys : TwoDemeLDSystem n) (rho : Descent.Core.Rho) (M : ℝ) : ℝ :=')
          rep(p,
              'noncomputable def TwoDemeLDSystem.crossDCorrelation {n : ℕ}\n    (sys : TwoDemeLDSystem n) (rho M : ℝ) : ℝ :=',
              'noncomputable def TwoDemeLDSystem.crossDCorrelation {n : ℕ}\n    (sys : TwoDemeLDSystem n) (rho : Descent.Core.Rho) (M : ℝ) : ℝ :=')
          rep(p,
              'noncomputable def AffineTwoDemeLDSystem.crossDCorrelation {n : ℕ}\n    (sys : AffineTwoDemeLDSystem n) (rho M : ℝ) : ℝ :=',
              'noncomputable def AffineTwoDemeLDSystem.crossDCorrelation {n : ℕ}\n    (sys : AffineTwoDemeLDSystem n) (rho : Descent.Core.Rho) (M : ℝ) : ℝ :=')

          Path('.github/workflows/type-scaled-lean-core.yml').unlink()
      - name: Commit directly to main
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Descent/Coalescent/SampleMonomorphism.lean \
            Descent/Coalescent/StructuredPresentDay.lean \
            .github/workflows/type-scaled-lean-core.yml
          git commit -m 'Type scaled Tau and Rho Lean APIs'
          git pull --rebase origin main
          git push origin HEAD:main
