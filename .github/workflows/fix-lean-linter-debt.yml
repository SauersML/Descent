name: Fix Lean linter debt

on:
  push:
    branches: ["main"]
    paths:
      - '.github/workflows/fix-lean-linter-debt.yml'

permissions:
  contents: write

concurrency:
  group: fix-lean-linter-debt-main
  cancel-in-progress: true

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply narrow Lean linter fixes
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              assert count == 1, f'{path}: expected exactly one match, found {count}: {old!r}'
              p.write_text(text.replace(old, new, 1))

          # Generated constructor declarations are not authored API and should not
          # be judged by the scaled-parameter naming rule.
          replace_once(
              'Descent/Meta/Linters.lean',
              '  test declName := do\n    unless isDefinition (← getEnv) declName do return none\n    unless (← inCorpus declName) do return none\n    unless (← onScaledSurface declName) do return none\n',
              '  test declName := do\n    unless isDefinition (← getEnv) declName do return none\n    if ← Batteries.Tactic.Lint.isAutoDecl declName then return none\n    unless (← inCorpus declName) do return none\n    unless (← onScaledSurface declName) do return none\n')

          # Here rho is an ordinary Gaussian correlation coefficient, not Core.Rho.
          replace_once(
              'Descent/PopGen/DGP.lean',
              'noncomputable def bivariateNormalOrthant (a b ρ : ℝ) : ℝ :=\n  ((((ProbabilityTheory.gaussianReal 0 1).prod\n        (ProbabilityTheory.gaussianReal 0 1)).map\n      (fun z : ℝ × ℝ ↦ (z.1, ρ * z.1 + Real.sqrt (1 - ρ ^ 2) * z.2)))\n    (Set.Iic a ×ˢ Set.Iic b)).toReal\n',
              'noncomputable def bivariateNormalOrthant (a b corr : ℝ) : ℝ :=\n  ((((ProbabilityTheory.gaussianReal 0 1).prod\n        (ProbabilityTheory.gaussianReal 0 1)).map\n      (fun z : ℝ × ℝ ↦ (z.1, corr * z.1 + Real.sqrt (1 - corr ^ 2) * z.2)))\n    (Set.Iic a ×ˢ Set.Iic b)).toReal\n')

          # These eight declarations produce proofs/Prop-valued certificates, so
          # Batteries' defLemma linter is right: state them as theorems.
          for name in [
              'panelMomentPairDomainWitness',
              'panelMomentDomainWitness',
              'selectionPanelDomainWitness',
              'panelMomentNormalizationDomainWitness',
          ]:
              replace_once(
                  'Descent/Coalescent/StructuredPresentDay.lean',
                  f'noncomputable def {name}',
                  f'theorem {name}')

          replace_once(
              'Descent/Coalescent/TwoLocusHistory.lean',
              'def LowOrderLDDDRealization.toLDPairDomain',
              'theorem LowOrderLDDDRealization.toLDPairDomain')
          replace_once(
              'Descent/Coalescent/TwoLocusHistory.lean',
              'def LowOrderLDHaplotypeRealization.toLDPairDomain',
              'theorem LowOrderLDHaplotypeRealization.toLDPairDomain')
          replace_once(
              'Descent/Core/GroupoidFunctor.lean',
              'def FunctorData.faithful',
              'theorem FunctorData.faithful')
          replace_once(
              'Descent/Pangenome/Chart.lean',
              'noncomputable def faithful (bridgeData : BridgeFunctorData P Q)',
              'theorem faithful (bridgeData : BridgeFunctorData P Q)')

          Path('.github/workflows/fix-lean-linter-debt.yml').unlink()

      - name: Commit directly to main
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Descent/Meta/Linters.lean Descent/PopGen/DGP.lean \
            Descent/Coalescent/StructuredPresentDay.lean \
            Descent/Coalescent/TwoLocusHistory.lean \
            Descent/Core/GroupoidFunctor.lean Descent/Pangenome/Chart.lean \
            .github/workflows/fix-lean-linter-debt.yml
          git commit -m 'Fix Lean linter classification noise'
          git pull --rebase origin main
          git push origin HEAD:main
